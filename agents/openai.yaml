interface:
  display_name: "短剧发行工作流"
  short_description: "受控并行提取清晰单人物与合格场景，并生成严格双15秒连续的 Seedance 一键复制投喂包"
  default_prompt: "使用 $short-drama-release-workflow 处理这个本地短剧文件夹，按集受控并行提取剧情、原视频正式单人物图片和场景图片，并生成五种动作神态丰富、图片清晰、前后15秒连续、可直接投喂 Seedance/豆包的二次创作包；优先复用缓存但不降低质量。"

policy:
  allow_implicit_invocation: true
